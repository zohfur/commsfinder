name: Build for Chrome and Firefox

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Chrome & Firefox Extensions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm i

      - name: Get Extension Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Chrome & Firefox Extensions
        run: npm run build:both

      - name: Rename build zips
        id: zips
        run: |
          CHROME_ZIP="commsfinder-chrome-${{ steps.version.outputs.version }}.zip"
          FIREFOX_ZIP="commsfinder-firefox-${{ steps.version.outputs.version }}.zip"
          if [[ ! -f dist/chrome.zip ]]; then
            echo "Chrome build zip not found at dist/chrome.zip"
            exit 1
          fi
          if [[ ! -f dist/firefox.zip ]]; then
            echo "Firefox build zip not found at dist/firefox.zip"
            exit 1
          fi
          mv dist/chrome.zip "$CHROME_ZIP"
          mv dist/firefox.zip "$FIREFOX_ZIP"
          echo "chrome_zip=$CHROME_ZIP" >> $GITHUB_OUTPUT
          echo "firefox_zip=$FIREFOX_ZIP" >> $GITHUB_OUTPUT

      - name: Upload Chrome Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commsfinder-chrome-${{ steps.version.outputs.version }}
          path: ${{ steps.zips.outputs.chrome_zip }}

      - name: Upload Firefox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commsfinder-firefox-${{ steps.version.outputs.version }}
          path: ${{ steps.zips.outputs.firefox_zip }}
